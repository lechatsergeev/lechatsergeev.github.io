<head>

<title>Вкладка «График» — демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="schedule.css?v=26">

<style>
  /* Оболочка мини-приложения: те же фон и шрифт, что в боте */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #f6f6f6; }
  #bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: #f6f6f6; }
  #bg.fallback { background-color: #EFC1DA;
    background-image: linear-gradient(90deg,#EFC1DA 0%,#EFC1DA 20%,#CEC99F 23.9%,#CEC99F 51.1%,#DCD6F6 58.9%,#DCD6F6 81.1%,#B5D0D9 85%,#B5D0D9 100%); }
  #gradient-canvas { width: 100%; height: 100%; display: block; }
  body { font-family: 'Onest', -apple-system, sans-serif; background: transparent; color: #111;
    font-variant-numeric: tabular-nums; padding: 26px 22px 40px; max-width: 480px; margin: 0 auto; }
</style>
<script>
/* Рамка телефона в портфолио уже настоящего экрана: рисуем вкладку на ширине iPhone (402) и уменьшаем целиком,
   чтобы заголовок и вкладки не переносились раньше, чем в боте. */
(function () { function fit() { var w = window.innerWidth; document.documentElement.style.zoom = w < 402 ? String(w / 402) : ""; }
  fit(); addEventListener("resize", fit); })();
</script>
<script>
/* Демо для портфолио: настоящий модуль вкладки «График» из бота,
   вместо сервера — выдуманный ресторан. Имена из презентации для коллег. */
window.Telegram = { WebApp: { initData: "", ready: function () {}, openLink: function () {} } };
window.selectTab = function () {};
(function () {
  var NAMES = ["Аня", "Боря", "Вика", "Гоша", "Даша", "Ева", "Женя", "Зоя", "Ира", "Костя", "Лёва"];
  var ME = 2;                                            // «я» — Вика
  var TODAY = "2026-11-16";
  function days(a, b) { var out = [], d = new Date(a + "T12:00:00"), e = new Date(b + "T12:00:00");
    for (; d <= e; d.setDate(d.getDate() + 1)) out.push(d.toISOString().slice(0, 10)); return out; }
  function build(start, end, seed) {
    var list = days(start, end);
    var people = NAMES.map(function (name, i) { return { name: name, me: i === ME, cells: {}, off: [] }; });
    list.forEach(function (iso, k) {
      var wd = new Date(iso + "T12:00:00").getDay(), weekend = wd === 0 || wd === 5 || wd === 6;
      var need = weekend ? 6 : 5;
      // два через два со сдвигом у каждого; набираем нужное число людей
      var on = people.map(function (p, i) { return { p: p, i: i, w: ((k + i + seed) % 4) < 2 }; })
        .sort(function (a, b) { return (b.w - a.w) || ((a.i * 7 + k) % 11 - (b.i * 7 + k) % 11); })
        .slice(0, need);
      var starts = weekend ? ["10", "10", "11", "12", "12", "14"] : ["10", "11", "12", "12", "14"];
      on.forEach(function (x, j) { x.p.cells[iso] = starts[j]; });
    });
    // обязательные выходные и необычные интервалы — как в презентации
    function off(n, iso) { if (list.indexOf(iso) < 0) return; delete people[n].cells[iso]; people[n].off.push(iso); }
    off(0, start.slice(0, 8) + (seed ? "18" : "04")); off(0, start.slice(0, 8) + (seed ? "19" : "05"));
    off(5, list[0]); off(5, list[1]);
    if (seed) { people[6].cells[start.slice(0, 8) + "18"] = "10-18"; people[2].cells[start.slice(0, 8) + "24"] = undefined; off(2, start.slice(0, 8) + "24"); }
    return { start: start, end: end, days: list, people: people, events: {}, holidays: seed ? {} : { "2026-11-04": "День народного единства" } };
  }
  var PERIODS = { "2026-11-01": build("2026-11-01", "2026-11-15", 0), "2026-11-16": build("2026-11-16", "2026-11-30", 1) };
  window.fetch = function (u, o) {
    var body = {}; try { body = JSON.parse((o && o.body) || "{}"); } catch (e) {}
    var p = PERIODS[body.start || "2026-11-16"];
    var json = { available: true, today: TODAY, restaurant_id: 1, restaurants: [{ id: 1, name: "Ресторан" }],
      periods: [{ start: "2026-11-01", end: "2026-11-15" }, { start: "2026-11-16", end: "2026-11-30" }],
      period: p, can_edit: false, site_url: null,
      mine: { requests: [{ days: ["2026-11-24"], limit: 3 }], weekdays: [], pattern: "2/2" } };
    return Promise.resolve({ ok: true, json: function () { return Promise.resolve(json); } });
  };
})();
</script>
</head>
<body>
<div id="bg" aria-hidden="true"><canvas id="gradient-canvas"></canvas></div>
<div class="tabs-scroll"><nav class="app-tabs nimbus-nav" role="tablist" aria-label="Разделы">
  <button id="tab-earnings" class="nimbus-item" role="tab" aria-selected="false" tabindex="-1">Деньги</button>
  <button id="tab-schedule" class="nimbus-item" role="tab" aria-selected="true">График</button>
</nav></div>
<section id="schedule-panel"></section>
<script src="background.js"></script>
<script src="schedule-grid.js?v=26"></script>
<script src="schedule.js?v=26"></script>
<script>
  // Вкладки: плашка из светлого стекла переезжает под выбранную вкладку (приём «animated tabs» с 21st.dev, перенесён без React).
  // Поверх лежит копия надписей на стекле, обрезанная по выбранной вкладке; при переключении
  // обрезка плавно едет, и текст меняет цвет прямо по ходу. Следит за aria-selected и hidden, сам ничего не переключает.
  (function(nav){
    if(!nav)return;
    const glass=document.createElement('span');glass.className='nimbus-glass';glass.setAttribute('aria-hidden','true');
    const over=document.createElement('div');over.className='clip-tabs';over.setAttribute('aria-hidden','true');
    nav.prepend(glass);nav.append(over);
    const tabs=[...nav.querySelectorAll('[role=tab]')];
    const copies=tabs.map(t=>{const c=document.createElement('span');c.className='nimbus-item';c.textContent=t.textContent;over.append(c);return c;});
    let ready=false;
    function update(){
      tabs.forEach((t,i)=>{if(copies[i].hidden!==t.hidden)copies[i].hidden=t.hidden;});
      const a=tabs.find(t=>!t.hidden&&t.getAttribute('aria-selected')==='true');
      if(!a||!nav.clientWidth){over.style.clipPath='inset(50%)';return;}
      const top=a.offsetTop,left=a.offsetLeft,right=nav.clientWidth-left-a.offsetWidth,bottom=nav.clientHeight-top-a.offsetHeight;
      if(!ready)over.style.transition='none';
      over.style.clipPath=`inset(${top}px ${right}px ${bottom}px ${left}px round 999px)`;
      if(!ready){over.offsetWidth;over.style.transition='';ready=true;}
    }
    // Следим только за самими вкладками: копии надписей тоже внутри nav, и слежка за всем nav зациклилась бы.
    const mo=new MutationObserver(update);tabs.forEach(t=>mo.observe(t,{attributes:true,attributeFilter:['aria-selected','hidden']}));
    if(window.ResizeObserver)new ResizeObserver(update).observe(nav);
    document.fonts&&document.fonts.ready.then(update);
    update();
  })(document.querySelector('.app-tabs'));
</script>
</body>
</html>
